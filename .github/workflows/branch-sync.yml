name: Branch Sync and Checks

on:
  pull_request:
    branches:
      - main-staging
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f setup/requirements.txt ]; then pip install -r setup/requirements.txt; fi

      - name: Basic Smoke Test
        run: |
          pytest

      - name: Lint with flake8
        # Stop the build if there are Python syntax errors or undefined names
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=AI_Compass_data_generation_2
          # exit-zero treats all errors as warnings.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=AI_Compass_data_generation_2

      - name: Check Formatting with Black
        run: |
          black --check . --exclude=AI_Compass_data_generation_2

  automerge:
    permissions:
      contents: write
      pull-requests: write
    needs: checks
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'dev/')
    steps:
      - name: Auto-merge
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
